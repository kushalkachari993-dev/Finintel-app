[project]
name = "finintel-ai"
version = "0.1.0"
description = "Indian Financial Intelligence Platform"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "streamlit",
    "groq",
    "python-dotenv",
    "tavily-python",
    "pandas",
    "numpy",
    "requests",
    "redis",
    "yfinance>=1.3.0",
    "pytest",
    "pyjwt[crypto]>=2.13.0",
    "sentry-sdk[fastapi]>=2.60.0",
    "psycopg[binary]>=3.2.0",
]
